[package]
name = "suneiro-desktop"
description = "Suneiro: coding agents, worktrees, and reviews together"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "suneiro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
suneiro-core = { path = "../../../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
parking_lot.workspace = true
log.workspace = true
tauri-plugin-updater = "2"
# Error reports (Rust panics, webview errors) to PostHog Error Tracking.
# Release builds only, and only while Settings -> Send error reports is on.
# See src/error_reports.rs.
posthog-rs = "0.30"
dirs.workspace = true
