# Build, sign, notarize and publish Suneiro when a version tag is pushed.
# The published release carries `latest.json`, which installed apps poll to
# update themselves (see docs/RELEASING.md for the one-time setup).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      # Symbol uploads for readable error stack traces (scripts/posthog-symbols.mjs).
      # Personal key scoped to error_tracking:write on the Suneiro Desktop project;
      # without it the release still builds, just without uploads.
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      POSTHOG_CLI_PROJECT_ID: "701028"
      POSTHOG_CLI_HOST: https://us.posthog.com
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "suneiro-desktop") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version (run: pnpm bump <version>)"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile

      # App Store Connect API key for notarization, as a file.
      - name: Write notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signature (minisign), checked by installed apps.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Developer ID code signing.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # Line tables in a separate dSYM per architecture (the shipped binary
          # stays the same size), uploaded to PostHog below for panic frames.
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: Suneiro v__VERSION__
          releaseBody: See the assets below to download and install this version.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json

      # Unversioned copy of the installer, so
      # https://github.com/steebchen/suneiro/releases/latest/download/Suneiro.dmg
      # always serves the newest build (the website links there).
      - name: Upload Suneiro.dmg
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
          VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          dmg=$(jq -r '.[] | select(endswith(".dmg"))' <<<"$ARTIFACTS" | head -n1)
          cp "$dmg" "$RUNNER_TEMP/Suneiro.dmg"
          gh release upload "v$VERSION" "$RUNNER_TEMP/Suneiro.dmg" --clobber

      # The JavaScript source maps were uploaded during the build (pnpm build:release).
      - name: Upload Rust debug symbols to PostHog
        run: |
          node scripts/posthog-symbols.mjs dsyms \
            target/aarch64-apple-darwin/release/suneiro-desktop.dSYM \
            target/x86_64-apple-darwin/release/suneiro-desktop.dSYM
