[workspace]
resolver = "2"
members = ["crates/core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
portable-pty = "0.9"
log = "0.4"
